name: Build OpenWrt Firmware (x86_64 + openclash)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl xz-utils make gawk file unzip

      - name: Download openclash prebuilt ipk (from official release)
        run: |
          mkdir -p prebuilt
          curl -L --retry 3 --fail -o prebuilt/luci-app-openclash_0.47.156_all.ipk \
            "https://github.com/vernesong/OpenClash/releases/download/v0.47.156/luci-app-openclash_0.47.156_all.ipk"
          file prebuilt/luci-app-openclash_0.47.156_all.ipk

      - name: Neutralize openclash postinst (ImageBuilder compatibility)
        run: |
          cd prebuilt
          mkdir -p debx
          dpkg-deb -R luci-app-openclash_0.47.156_all.ipk debx
          printf '#!/bin/sh\nexit 0\n' > debx/DEBIAN/postinst
          chmod +x debx/DEBIAN/postinst
          rm -f luci-app-openclash_0.47.156_all.ipk
          dpkg-deb -b debx luci-app-openclash_0.47.156_all.ipk
          file luci-app-openclash_0.47.156_all.ipk

      - name: Build firmware
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/
          if-no-files-found: error
