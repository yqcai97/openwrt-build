name: Build OpenWrt Firmware (x86_64 + openclash)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl xz-utils make gawk file unzip

      - name: Download openclash prebuilt ipk (from official release)
        run: |
          mkdir -p prebuilt
          curl -L --retry 3 --fail -o prebuilt/luci-app-openclash_0.47.156_all.ipk \
            "https://github.com/vernesong/OpenClash/releases/download/v0.47.156/luci-app-openclash_0.47.156_all.ipk"
          file prebuilt/luci-app-openclash_0.47.156_all.ipk

      - name: Fix openclash ipk (neutralize postinst, rebuild as ar)
        run: |
          python3 fix-openclash-ipk.py prebuilt/luci-app-openclash_0.47.156_all.ipk openclash-files
          # 把解出的 openclash 文件合并进 files/ 覆盖层（随 FILES= 注入根文件系统）
          if [ -d openclash-files ]; then
            mkdir -p files
            cp -r openclash-files/. files/
          fi
          find files -type f | head -20
          echo "overlay files: $(find files -type f | wc -l)"

      - name: Build firmware
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/
          if-no-files-found: error

      - name: Create GitHub Release with firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin
          VERSION="firmware-$(date +%Y%m%d-%H%M)"
          gh release create "$VERSION" *.img.gz sha256sums \
            --repo "${{ github.repository }}" \
            --title "OpenWrt 23.05.5 定制固件 (CWWK G4 + openclash)" \
            --notes "四口网卡驱动 + openclash + docker/upnp/sqm 等；默认 192.168.1.1 / root / root"
          echo "release created: $VERSION"
